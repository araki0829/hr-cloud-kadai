name: hrcloud

services:
  app:
    build:
      context: ../
      dockerfile: docker/Dockerfile
    container_name: hrcloud-app
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ../:/var/www/html/my_fuel_project
    networks:
      - fuelphp-network

  db:
    build:
      context: ../
      dockerfile: docker/db/Dockerfile
    container_name: hrcloud-db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: intern_kadai_hrcloud
    ports:
      - "3306:3306"
    networks:
      - fuelphp-network

networks:
  fuelphp-network:
    driver: bridge
